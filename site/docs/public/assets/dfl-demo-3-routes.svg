  <text x="40" y="79" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="700" fill="#38bdf8">Case A: 5-Line Bugfix → CODE_ONLY Route</text>
  <g font-family="'DejaVu Sans Mono', monospace" font-size="11.5">
    <text x="40" y="112" xml:space="preserve"><tspan fill="#34d399">$ </tspan><tspan fill="#38bdf8" font-weight="700">/classify-task</tspan></text>
    <text x="40" y="133" xml:space="preserve"><tspan fill="#f8fafc">  &quot;Fix negative discount clamp in CHK-1.2&quot;</tspan></text>
    <text x="40" y="154" xml:space="preserve"><tspan fill="undefined"></tspan></text>
    <text x="40" y="175" xml:space="preserve"><tspan fill="#34d399">✔ Cited requirement: </tspan><tspan fill="#e2e8f0">CHK-1.2 (unchanged)</tspan></text>
    <text x="40" y="196" xml:space="preserve"><tspan fill="#34d399">✔ Proposed route: </tspan><tspan fill="#38bdf8" font-weight="700">code (CODE_ONLY)</tspan></text>
    <text x="40" y="217" xml:space="preserve"><tspan fill="#94a3b8">  Skips Behavior &amp; Tech design — zero ceremony.</tspan></text>
    <text x="40" y="238" xml:space="preserve"><tspan fill="undefined"></tspan></text>
    <text x="40" y="259" xml:space="preserve"><tspan fill="#34d399">$ </tspan><tspan fill="#f8fafc" font-weight="700">dfl next CODE_ONLY</tspan></text>
    <text x="40" y="280" xml:space="preserve"><tspan fill="undefined"></tspan></text>
    <text x="40" y="301" xml:space="preserve"><tspan fill="#34d399">● Classify</tspan><tspan fill="#38bdf8" font-weight="700"> ──[CODE_ONLY]──▶ </tspan><tspan fill="#38bdf8" font-weight="700">● Implement</tspan></text>
    <text x="40" y="322" xml:space="preserve"><tspan fill="#475569">                                   │</tspan></text>
    <text x="40" y="343" xml:space="preserve"><tspan fill="#475569">                                   ▼</tspan></text>
    <text x="40" y="364" xml:space="preserve"><tspan fill="#94a3b8">                              ○ Dev QA</tspan></text>
    <text x="40" y="385" xml:space="preserve"><tspan fill="#475569">                                   │</tspan></text>
    <text x="40" y="406" xml:space="preserve"><tspan fill="#475569">                                   ▼</tspan></text>
    <text x="40" y="427" xml:space="preserve"><tspan fill="#34d399">                               ○ Ship → Done</tspan></text>
