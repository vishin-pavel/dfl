    <text x="502" y="406" xml:space="preserve"><tspan fill="#475569">               ▼</tspan></text>
    <text x="502" y="427" xml:space="preserve"><tspan fill="#94a3b8">          ○ Implement → ○ Dev QA → ○ Ship</tspan></text>
  </g>

  <!-- Footer -->
  <text x="26" y="510" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" fill="#94a3b8">4 built-in routes: code (bugfix/chore) · behavior (business rules) · design (tech-only) · full (new capability)</text>
