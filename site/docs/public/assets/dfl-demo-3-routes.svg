    <text x="502" y="238" xml:space="preserve"><tspan fill="undefined"></tspan></text>
    <text x="502" y="259" xml:space="preserve"><tspan fill="#34d399">$ </tspan><tspan fill="#f8fafc" font-weight="700">dfl next NEXT</tspan></text>
    <text x="502" y="280" xml:space="preserve"><tspan fill="undefined"></tspan></text>
    <text x="502" y="301" xml:space="preserve"><tspan fill="#34d399">✔ Classify</tspan><tspan fill="#64748b"> → </tspan><tspan fill="#38bdf8" font-weight="700">● Behavior</tspan><tspan fill="#94a3b8"> (Given/When/Then)</tspan></text>
    <text x="502" y="322" xml:space="preserve"><tspan fill="#475569">               │</tspan></text>
    <text x="502" y="343" xml:space="preserve"><tspan fill="#475569">               ▼</tspan></text>
    <text x="502" y="364" xml:space="preserve"><tspan fill="#94a3b8">          ○ Tech design (ISO 25010 + DEC-1)</tspan></text>
