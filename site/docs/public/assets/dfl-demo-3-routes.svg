  <g font-family="'DejaVu Sans Mono', monospace" font-size="11.5">
    <text x="502" y="112" xml:space="preserve"><tspan fill="#34d399">$ </tspan><tspan fill="#38bdf8" font-weight="700">/classify-task</tspan></text>
    <text x="502" y="133" xml:space="preserve"><tspan fill="#f8fafc">  &quot;Add streaming CSV order export with PII&quot;</tspan></text>
    <text x="502" y="154" xml:space="preserve"><tspan fill="undefined"></tspan></text>
