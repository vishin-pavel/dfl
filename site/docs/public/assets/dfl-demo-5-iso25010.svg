<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Demo 5: Steer AI Architecture with ISO/IEC 25010 Quality Attributes">
  <rect width="960" height="540" fill="#070b14"/>
  <rect x="12" y="12" width="936" height="516" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1.5"/>
  <path d="M12 24 Q12 12 24 12 L936 12 Q948 12 948 24 L948 48 L12 48 Z" fill="#111827"/>
