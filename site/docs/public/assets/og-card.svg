<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="dfl (devFlow) — Deterministic Dev Workflows for 9 Coding Agents · XState + MCP · Zero Telemetry">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="55%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#09121e"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="18%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="85%" cy="82%" r="42%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Canvas background -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  <rect width="1280" height="640" fill="url(#dotGrid)"/>
  <rect width="1280" height="640" fill="url(#cyanGlow)"/>
  <rect width="1280" height="640" fill="url(#emeraldGlow)"/>

  <!-- Outer frame -->
  <rect x="16" y="16" width="1248" height="608" rx="14" fill="#0b1120" fill-opacity="0.88" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top terminal chrome bar -->
  <path d="M16 30 Q16 16 30 16 L1250 16 Q1264 16 1264 30 L1264 58 L16 58 Z" fill="#111827"/>
  <line x1="16" y1="58" x2="1264" y2="58" stroke="#1e293b" stroke-width="1"/>
  <circle cx="42" cy="37" r="6" fill="#f87171"/>
  <circle cx="62" cy="37" r="6" fill="#fbbf24"/>
  <circle cx="82" cy="37" r="6" fill="#34d399"/>
  <text x="106" y="42" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" fill="#94a3b8">dfl (devFlow) — terminal workflow engine</text>

  <!-- Top-right trust pill -->
  <rect x="938" y="25" width="306" height="24" rx="12" fill="#064e3b" fill-opacity="0.55" stroke="#10b981" stroke-opacity="0.5" stroke-width="1"/>
  <circle cx="956" cy="37" r="4" fill="#34d399"/>
  <text x="968" y="41" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#6ee7b7">100% Local · Zero Telemetry · MIT</text>

  <!-- LEFT COLUMN: Brand + Tagline + Pillars + Install -->
  <g font-family="'DejaVu Sans', 'Liberation Sans', sans-serif">
    <!-- Brand title -->
    <text x="48" y="142" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="60" font-weight="700" fill="#38bdf8">dfl</text>
    <text x="172" y="142" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="34" font-weight="400" fill="#94a3b8">(devFlow)</text>

    <!-- Primary Tagline (exact required copy) -->
    <text x="48" y="196" font-size="22" font-weight="700" fill="#f8fafc">Deterministic Dev Workflows</text>
    <text x="48" y="226" font-size="22" font-weight="700" fill="#f8fafc">for 9 Coding Agents</text>
    <text x="48" y="258" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="16" font-weight="600" fill="#38bdf8">XState + MCP · Zero Telemetry</text>

    <!-- Supporting hook -->
    <text x="48" y="302" font-size="14.5" fill="#cbd5e1">Stop letting coding agents grade their own homework.</text>
    <text x="48" y="324" font-size="14.5" fill="#94a3b8">Fresh-session diff audits, ISO 25010 tech design, and</text>
    <text x="48" y="346" font-size="14.5" fill="#94a3b8">compiler-guarded flow edits — versioned in git.</text>

    <!-- 3 Feature pills -->
    <rect x="48" y="374" width="128" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="112" y="394" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="12.5" fill="#e2e8f0">xstate v5 DAG</text>

    <rect x="186" y="374" width="152" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="262" y="394" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="12.5" fill="#e2e8f0">15-Tool Stdio MCP</text>

    <rect x="348" y="374" width="144" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="420" y="394" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="12.5" fill="#e2e8f0">9 Coding Agents</text>

    <!-- Install command box -->
    <rect x="48" y="428" width="444" height="58" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1.2"/>
    <text x="64" y="452" font-family="'DejaVu Sans Mono', monospace" font-size="12.5" fill="#34d399">$</text>
    <text x="80" y="452" font-family="'DejaVu Sans Mono', monospace" font-size="12.5" fill="#f1f5f9">npm i -g @vishin-pavel/dfl</text>
    <text x="64" y="473" font-family="'DejaVu Sans Mono', monospace" font-size="12.5" fill="#34d399">$</text>
    <text x="80" y="473" font-family="'DejaVu Sans Mono', monospace" font-size="12.5" fill="#38bdf8">dfl install</text>
    <text x="168" y="473" font-family="'DejaVu Sans Mono', monospace" font-size="12.5" fill="#64748b">&amp;&amp; dfl flow view</text>

    <!-- Supported agents line -->
    <text x="48" y="520" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" fill="#64748b">Claude Code · Cursor · Antigravity · Codex · Gemini CLI</text>
    <text x="48" y="538" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" fill="#64748b">GitHub Copilot · Windsurf · OpenCode · Kiro</text>

    <!-- Footer metadata -->
    <line x1="48" y1="564" x2="492" y2="564" stroke="#1e293b" stroke-width="1"/>
    <text x="48" y="592" font-family="'DejaVu Sans Mono', monospace" font-size="12.5" fill="#94a3b8">github.com/vishin-pavel/dfl</text>
    <text x="492" y="592" text-anchor="end" font-family="'DejaVu Sans Mono', monospace" font-size="12" fill="#64748b">v0.3.0 · Node &gt;=22.12</text>
  </g>

  <!-- RIGHT COLUMN: Authentic dfl flow view print zoom 0 lr Terminal Pane -->
  <rect x="520" y="76" width="726" height="530" rx="10" fill="#050811" stroke="#1e293b" stroke-width="1.2"/>
  <path d="M520 86 Q520 76 530 76 L1236 76 Q1246 76 1246 86 L1246 106 L520 106 Z" fill="#0f172a"/>
  <line x1="520" y1="106" x2="1246" y2="106" stroke="#1e293b" stroke-width="1"/>
  <text x="538" y="95" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" fill="#34d399">$</text>
  <text x="552" y="95" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" fill="#e2e8f0">dfl flow view --print --zoom 0 --lr</text>
  <text x="1232" y="95" text-anchor="end" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" fill="#64748b">dev (6 steps · 4 routes)</text>

