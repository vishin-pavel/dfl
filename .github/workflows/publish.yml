name: Publish

# Publishes @vishin-pavel/dfl to npmjs.org for a published release or a pushed v* tag.
# Both usually fire for one release; the second run sees the version already published and skips.
# Prereleases (v1.2.0-rc.1, or a GitHub release marked as prerelease) go to the `next` dist-tag,
# everything else to `latest` (see scripts/publish-tag.mjs).
on:
  release:
    types: [published]
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
      # The .npmrc written by setup-node reads the token from NODE_AUTH_TOKEN. setup-node v7 no longer
      # exports a placeholder value, so it is set for the whole job (empty when using npm Trusted Publishing / OIDC).
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Check that the tag matches package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${version} (expected v${version})."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Choose the dist-tag
        id: dist
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "${RELEASE_PRERELEASE}" = "true" ]; then
            tag="$(node scripts/publish-tag.mjs "${VERSION}" --prerelease)"
          else
            tag="$(node scripts/publish-tag.mjs "${VERSION}")"
          fi
          echo "Publishing ${VERSION} with dist-tag ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Skip if this version is already published
        id: published
        run: |
          name="$(node -p "require('./package.json').name")"
          if npm view "${name}@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "::notice::${name}@${{ steps.version.outputs.version }} is already published; skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.published.outputs.exists != 'true'
        env:
          DIST_TAG: ${{ steps.dist.outputs.tag }}
        run: npm publish --provenance --tag "${DIST_TAG}"
