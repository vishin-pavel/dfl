name: Feature Request
description: Suggest a new feature or improvement for dfl
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of dfl does this relate to?
      options:
        - CLI commands
        - Flow engine / state machine
        - Default `dev` flow / templates
        - MCP server
        - Fast-forward runs
        - Jira tracker integration
        - Terminal flow viewer (`dfl flow view`)
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: Describe the workflow gap or pain point you are trying to solve.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior, CLI flags, MCP tool, or configuration you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative designs you considered.
